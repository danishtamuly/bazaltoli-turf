<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Project proposal: sports turf, café, billiards and gaming facility at Bazaltoli Gaon, Tinsukia, Assam">
<title>Bazaltoli Turf &amp; Café Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F4F6F2; --surface:#FFFFFF; --ink:#16211B; --muted:#5B6A61; --line:#D8E0D9;
  --accent:#1E6E47; --accent-soft:#E2EFE6; --warn:#9A5B12; --warn-soft:#FBEFD9;
  --good:#1E6E47; --bad:#A33A2C;
  --sky:#DCE7EE; --ground:#C9D3C2;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#18221C; --ink:#E7EEE9; --muted:#9AAAA0; --line:#2B3830;
  --accent:#5CC08B; --accent-soft:#1D3327; --warn:#E3A857; --warn-soft:#33281A;
  --good:#5CC08B; --bad:#E58373; --sky:#1B2630; --ground:#26302A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#18221C; --ink:#E7EEE9; --muted:#9AAAA0; --line:#2B3830;
  --accent:#5CC08B; --accent-soft:#1D3327; --warn:#E3A857; --warn-soft:#33281A;
  --good:#5CC08B; --bad:#E58373; --sky:#1B2630; --ground:#26302A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(30px,5vw,46px);font-weight:700;letter-spacing:.01em}
h2{font-size:26px;font-weight:600;margin-bottom:12px}
h3{font-size:19px;font-weight:600}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.lede{color:var(--muted);max-width:68ch;margin-top:8px}
header{display:flex;flex-direction:column;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.viewer{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage{position:relative;height:min(64vh,580px);min-height:360px;background:var(--sky)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.tag{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 13px/24px var(--f-body);text-align:center;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.views{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px}
.views button{font:600 13px var(--f-body);padding:6px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.views button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.views .sep{width:1px;background:var(--line);margin:2px 2px}
.views button:focus-visible,.inp input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--surface);padding:2px 8px;border-radius:4px;opacity:.9}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 20px;padding:16px 18px;border-top:1px solid var(--line)}
.legend div{display:flex;gap:10px;align-items:baseline;font-size:14px}
.legend span.n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;font-size:12px;text-align:center;line-height:20px}
.legend small{color:var(--muted);display:block}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--bg)}
td.num,th.num{text-align:right;white-space:nowrap}
tr.grp td{background:var(--accent-soft);font-weight:700;font-family:var(--f-display);font-size:16px;letter-spacing:.02em}
tr.sub td{font-weight:700}
tr.total td{font-weight:700;font-size:16px;border-top:2px solid var(--ink)}
td small{color:var(--muted);display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.v.good{color:var(--good)} .v.bad{color:var(--bad)}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.inp{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
